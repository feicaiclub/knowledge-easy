name: Validate skill package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check package integrity, references, and source syntax
        run: python3 scripts/validate_package.py --verify-manifest
      - name: Check visual geometry, backgrounds, and caption rules
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_visuals.py' -q
          python3 -B -m unittest discover -s scripts/tests -p 'test_language.py' -q
