name: Validate skill package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check package integrity, references, and source syntax
        run: python3 scripts/validate_package.py --verify-manifest
