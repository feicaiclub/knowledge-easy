name: Validate skill package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check package integrity, references, and source syntax
        run: python3 scripts/validate_package.py --verify-manifest
      - name: Install media tools for exported-video review tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check production, illustration, references, timing and review behavior
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -q
